<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Synced Reading Page</title>
    <link rel="stylesheet" href="styles.css?v=6" />
  </head>
  <body class="reader-body">
    <main class="reader-shell">
      <section class="reader-page">
        <div id="marginalia-layer" class="marginalia-layer" aria-hidden="true"></div>

        <header class="reader-header">
          <div>
            <h1 id="page-title">Loading...</h1>
          </div>
        </header>

        <p class="reader-hint">Tap a word to check its meaning.</p>

        <article id="transcript" class="transcript" aria-label="Synced transcript"></article>

        <footer class="player-bar">
          <div class="transport-controls">
            <button id="play-button" class="play-button" aria-label="Play" disabled>
              <span class="play-icon" aria-hidden="true"></span>
            </button>
            <button id="pause-button" class="pause-button" aria-label="Pause" disabled>
              <span class="pause-icon" aria-hidden="true"></span>
            </button>
          </div>
          <div class="timeline">
            <div id="progress" class="progress"></div>
          </div>
          <span id="time-label" class="time-label">0:00</span>
          <audio id="audio" preload="auto"></audio>
        </footer>

        <section id="word-sheet" class="word-sheet" aria-live="polite">
          <div class="word-sheet-handle"></div>
          <div class="word-sheet-top">
            <div class="word-sheet-heading">
              <div class="language-pill">
                <span aria-hidden="true">Translation</span>
                <select id="language-select" class="language-select" aria-label="Translation language">
                  <option>Turkish</option>
                  <option>Spanish</option>
                  <option>French</option>
                  <option>Italian</option>
                  <option>German</option>
                  <option>Portuguese</option>
                  <option>Arabic</option>
                  <option>Chinese</option>
                  <option>Japanese</option>
                  <option>Korean</option>
                  <option>Polish</option>
                  <option>Russian</option>
                </select>
              </div>
              <h2 id="sheet-word">Choose a word</h2>
            </div>
            <button id="sheet-close" class="sheet-close" aria-label="Close word help">&times;</button>
          </div>

          <div id="sheet-content" class="sheet-content">
            <p>Select your language, then tap any word for a definition and translation.</p>
          </div>
        </section>
      </section>
    </main>

    <script src="play.js?v=6"></script>
  </body>
</html>
