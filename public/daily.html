<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Daily Bite</title>
    <link rel="stylesheet" href="daily.css?v=1" />
  </head>
  <body class="daily-body" data-mood="browse">
    <main class="daily-shell">
      <section class="daily-page" aria-live="polite">
        <div id="sticker-stage" class="sticker-stage" aria-hidden="true"></div>

        <header class="daily-header">
          <p>Daily Bite</p>
          <h1>Buying Clothes Online</h1>
        </header>

        <section id="story" class="daily-story"></section>

        <footer class="daily-footer">
          <div class="daily-progress" aria-hidden="true">
            <span id="progress-fill"></span>
          </div>
          <p id="status">Choose the best word to continue.</p>
        </footer>
      </section>
    </main>

    <script src="daily.js?v=1"></script>
  </body>
</html>
